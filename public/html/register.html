<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | OnliStyle</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <nav>
    <span class="nav-brand">ONLISTYLE</span>
    <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      <li><a href="/">Inicio</a></li>
      <li><a href="/agendar">Agendar cita</a></li>
      <li><a href="/login">Iniciar sesión</a></li>
    </ul>
  </nav>

  <div id="toast-container"></div>

  <div class="form-wrapper">
    <div class="form-card">
      <h2>REGÍSTRATE</h2>

      <form id="form_register" autocomplete="off">
        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="ej: Jaime López" maxlength="100" required>
        </div>

        <div class="form-group">
          <label for="ced">Cédula de ciudadanía</label>
          <input type="text" id="ced" name="ced" placeholder="ej: 1020304190" maxlength="20" required>
        </div>

        <div class="form-group">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" placeholder="ej: jaime@gmail.com" maxlength="100" required>
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" placeholder="ej: 3067789877" maxlength="20" required>
        </div>

        <div class="form-group">
          <label for="fecha_n">Fecha de nacimiento</label>
          <input type="date" id="fecha_n" name="fecha_n" required>
        </div>

        <div class="form-group">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" placeholder="••••••••••" maxlength="26" required>
        </div>

        <button type="submit" class="btn-submit">REGISTRARME</button>
      </form>

      <div class="form-footer">
        <a href="/">Inicio</a>
        <a href="/login">Ya tengo cuenta</a>
      </div>
    </div>
  </div>

  <script src="../js/toast.js"></script>
  <script src="../js/nav-icons.js"></script>
  <script>
    // ── Hamburguesa ──
    const toggle = document.getElementById("nav-toggle");
    const links  = document.getElementById("nav-links");
    toggle.addEventListener("click", () => {
      const open = links.classList.toggle("open");
      toggle.classList.toggle("open", open);
      toggle.setAttribute("aria-expanded", open);
    });
    links.querySelectorAll("a, button").forEach(el => {
      el.addEventListener("click", () => {
        links.classList.remove("open");
        toggle.classList.remove("open");
        toggle.setAttribute("aria-expanded", false);
      });
    });

    document.addEventListener("DOMContentLoaded", () => {
      const token = localStorage.getItem("token");
      if (token) {
        showToast("Ya tienes una cuenta activa.", "info");
        setTimeout(() => window.location = "/", 1200);
      }
    });

    document.getElementById("form_register").addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData(e.target);
      const datos = Object.fromEntries(formData.entries());

      try {
        const res = await fetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(datos)
        });

        const data = await res.json();

        if (res.ok || data.msg) {
          const isError = res.status >= 400;
          showToast(data.msg || "Registro completado.", isError ? "error" : "success");
          if (!isError) {
            setTimeout(() => window.location = "/login", 1500);
          }
        }

      } catch (error) {
        console.error(error);
        showToast("Algo falló. Intenta de nuevo.", "error");
      }
    });
  </script>
</body>
</html>
